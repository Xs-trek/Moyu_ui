plugins {
    id 'com.android.application'
}

def moyuLocalTest = (project.findProperty('moyuLocalTest') ?: 'false').toString().toBoolean()
if (moyuLocalTest && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('moyuLocalTest is debug-only and cannot be combined with a release task')
}

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId moyuLocalTest ? "com.moyu.remote.localtest" : "com.moyu.remote"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 3
        versionName "0.0.3"

        // The local-test APK runs on the installed x86 emulator and never loads EasyTier JNI.
        // Normal debug/release APKs remain arm64 and keep the production overlay path.
        ndk { abiFilters(moyuLocalTest ? 'x86' : 'arm64-v8a') }
        buildConfigField "boolean", "MOYU_LOCAL_TEST", moyuLocalTest ? "true" : "false"
        if (moyuLocalTest) versionNameSuffix "-localtest"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packagingOptions {
        doNotStrip '*/arm64-v8a/libeasytier_android_jni.so'
        doNotStrip '*/arm64-v8a/libeasytier_ffi.so'
    }
}

def uiDist = file('../../dist')
def uiAssets = file('src/main/assets/ui')
def nativeArm64 = file('src/main/jniLibs/arm64-v8a')
def expectedNativeSha256 = [
    'libeasytier_android_jni.so': 'B92A64620D084F9511AD03701CE9A9F62FF23268B8137B6A8337D367FE287BA9',
    'libeasytier_ffi.so': 'C4B7B42C6EB809869AAD9CFAFD2AE5877BFAC0AB827416FB6F2F525F457407D5'
]

tasks.register('syncMoyuUi', Sync) {
    dependsOn ':app:verifyMoyuUi'
    from(uiDist) {
        exclude 'preview.html'
        exclude 'phone.html'
        exclude 'assets/preview-*'
        exclude 'assets/phone-*'
        exclude 'assets/phone-preview-*'
    }
    into uiAssets
}

tasks.register('verifyMoyuUi') {
    doLast {
        if (!new File(uiDist, 'index.html').isFile()) {
            throw new GradleException('Missing ../../dist/index.html; run npm run build first')
        }
    }
}

tasks.register('verifyNativeLibraries') {
    doLast {
        expectedNativeSha256.each { name, expected ->
            def nativeFile = new File(nativeArm64, name)
            if (!nativeFile.isFile()) {
                throw new GradleException("Missing native library: ${nativeFile}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            nativeFile.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                    digest.update(buffer, 0, read)
                }
            }
            def actual = digest.digest().collect { String.format('%02X', it & 0xff) }.join()
            if (actual != expected) {
                throw new GradleException("SHA-256 mismatch for ${name}: expected ${expected}, got ${actual}")
            }
        }
    }
}

preBuild.dependsOn syncMoyuUi
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyNativeLibraries
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
}
